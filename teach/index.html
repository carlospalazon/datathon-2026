<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cangur tutor</title>
<style>
  :root { --ink: #1d2433; --muted: #5c667a; --line: #dfe3ea; --bg: #f5f7fa; --card: #fff; --accent: #1f5fbf;
          --ok: #1b7f3b; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fce8e6; --warn: #8a5a00; --warn-bg: #fff4dc;
          --led-off: #1a1f27; --led-on: #4fa3ff; --board: #0d1117; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #e6e9ef; --muted: #a3abb9; --line: #2c3340; --bg: #14181f; --card: #1c222b;
          --accent: #7aa7ff; --ok: #6fd08c; --ok-bg: #16301f; --bad: #ff8a80; --bad-bg: #3a1b1a; --warn: #f0b54a; --warn-bg: #3a2c10; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; margin: 0 8px 0 0; }
  .pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section, aside > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .problem-img { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .letters { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
  .letters button { width: 64px; height: 56px; font-size: 24px; font-weight: 700; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; }
  .letters button:hover:not(:disabled) { border-color: var(--accent); }
  .letters button:focus-visible, .actions button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .letters button.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .letters button.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .actions button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #feed { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .msg { border-left: 4px solid var(--line); padding: 8px 12px; background: var(--bg); border-radius: 6px; }
  .msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); } .msg.help { border-color: var(--accent); }
  .msg small { display: block; color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; background: var(--warn-bg); color: var(--warn); }
  .badge.revisado { background: var(--ok-bg); color: var(--ok); }
  .msg img { max-width: 100%; margin-top: 6px; background: #fff; border-radius: 6px; }
  .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; padding: 12px; background: var(--board); border-radius: 8px; }
  .matrix span { aspect-ratio: 1; border-radius: 50%; background: var(--led-off); }
  .matrix span.on { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }
  .muted { color: var(--muted); font-size: 14px; }
  ol { padding-left: 20px; margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Tutor Cangur</h1>
  <span class="pill" id="grade"></span>
  <span class="pill" id="topic"></span>
  <span class="pill" id="pid"></span>
</header>
<main>
  <section>
    <img class="problem-img" id="img" alt="Enunciat del problema">
    <div class="letters" id="letters" role="group" aria-label="Respostes"></div>
    <div class="actions">
      <button id="help" class="primary">Una pista</button>
      <button id="solution">Veure la solució</button>
      <button id="next">Següent problema</button>
    </div>
    <div id="feed" aria-live="polite"></div>
  </section>
  <aside>
    <div>
      <strong>Matriu LED de la placa</strong>
      <p class="muted">Simulada a la pantalla: el mateix que es veurà a la UNO Q.</p>
      <div class="matrix" id="matrix" aria-hidden="true"></div>
    </div>
    <div class="muted">
      Les respostes es corregeixen amb la solució verificada del Cangur, no amb el model.
      Cada ajuda indica d'on surt i si una persona l'ha revisada.
    </div>
  </aside>
</main>
<script>
const TOPICS = { aritmetica: "Càlcul amb dades", algebra: "Número amagat (tempteig)", conteo: "Comptar", numeros: "Propietats dels números",
  logica: "Lògica", patrones: "Patrons", geometria_plana: "Geometria plana", geometria_espacial: "Geometria de l'espai",
  medida: "Mesura", visual: "Raonament visual", otros: "Altres" };
const STATUS = { revisado: "revisat", preparado: "preparat", generado: "esborrany, no revisat", dataset: "problema del Cangur" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const matrix = $("#matrix");
for (let i = 0; i < 8 * 13; i++) matrix.append(document.createElement("span"));
function draw(frames) {
  if (!frames || !frames.length) return;
  const grid = frames[frames.length - 1];
  grid.flat().forEach((v, i) => matrix.children[i].classList.toggle("on", v > 0));
}

async function api(action, body) {
  const r = await fetch(action === "state" ? "/api/state" : "/api/" + action,
    action === "state" ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}
function say(html, kind) {
  const div = document.createElement("div");
  div.className = "msg " + (kind || "");
  div.innerHTML = html;
  $("#feed").prepend(div);
}
function badge(status) {
  return status ? `<span class="badge ${esc(status)}">${esc(STATUS[status] || status)}</span>` : "";
}

function show(view) {
  const p = view.problem;
  $("#img").src = "/image/" + encodeURIComponent(p.key);
  $("#grade").textContent = `${p.grade}è de primària · dificultat ${p.difficulty}`;
  $("#topic").textContent = TOPICS[p.topic] || p.topic;
  $("#pid").textContent = p.id;
  $("#feed").innerHTML = "";
  const box = $("#letters");
  box.innerHTML = "";
  for (const letter of "ABCDE") {
    const b = document.createElement("button");
    b.textContent = letter;
    b.setAttribute("aria-label", `Resposta ${letter}: ${p.options[letter] ?? ""}`);
    b.onclick = () => answer(letter, b);
    box.append(b);
  }
  draw(view.frames);
}

async function answer(letter, button) {
  const r = await api("answer", { letter });
  if (r.error) return say(esc(r.error), "bad");
  button.classList.add(r.correct ? "right" : "wrong");
  if (r.correct) {
    say(`<strong>Molt bé! La ${letter} és correcta.</strong>`, "ok");
    document.querySelectorAll(".letters button").forEach(b => b.disabled = true);
  } else {
    button.disabled = true;
    say(`<strong>La ${letter} no és correcta.</strong> Torna-ho a provar o demana una pista.`
      + (r.feedback ? `<br>${esc(r.feedback.text)}${badge(r.feedback.status)}` : ""), "bad");
  }
  draw(r.frames);
}

$("#help").onclick = async () => {
  const r = await api("help");
  draw(r.frames);
  if (r.kind === "similar") {
    const p = r.problem;
    say(`<strong>Pista 1: un problema semblant, més fàcil.</strong>${badge("dataset")}
      <small>Del mateix tipus, ${p.grade}è de primària. Mira com es resol i pensa què té en comú amb el teu.</small>
      <img src="/image/${encodeURIComponent(p.key)}" alt="Problema semblant ${esc(p.id)}">
      <small>La resposta d'aquest problema és la ${esc(r.label)}.</small>`, "help");
  } else if (r.kind === "method") {
    say(`<strong>Pista 2: com s'enfoca aquest tipus de problema.</strong>${badge(r.status)}
      <br>${esc(r.text)}<ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>`, "help");
  } else if (r.kind === "question") {
    ask(r);
  } else if (r.kind === "hint") {
    say(`<strong>Pista: </strong>${esc(r.text)}${badge(r.status)}`, "help");
  } else {
    say("Ja no hi ha més pistes per a aquest problema. Si vols, pots veure la solució.", "help");
  }
};

const QTITLE = { compare: "Compara", guide: "Pensa", checkpoint: "Comprova un pas" };
function ask(q) {
  const div = document.createElement("div");
  div.className = "msg help";
  const title = QTITLE[q.qid.split(" ")[0]] || "Pregunta";
  div.innerHTML = `<strong>${esc(title)}:</strong> ${esc(q.text)}${badge(q.status)}<div class="actions"></div><small class="reply"></small>`;
  const row = div.querySelector(".actions"), reply = div.querySelector(".reply");
  const send = async value => {
    const r = await api("respond", { qid: q.qid, value });
    if (r.error) { reply.textContent = r.error === "write a number" ? "Escriu un número." : r.error; return; }
    draw(r.frames);
    if (r.correct === null) { reply.textContent = "Molt bé. Quan ho tinguis, demana el pas següent."; row.remove(); return; }
    reply.textContent = (r.correct ? "Correcte! " : "Encara no. ") + (r.feedback || "");
    reply.style.color = r.correct ? "var(--ok)" : "var(--bad)";
    if (r.correct) row.querySelectorAll("button, input").forEach(e => e.disabled = true);
  };
  if (q.type === "reflect") {
    const b = document.createElement("button"); b.textContent = "Fet"; b.onclick = () => send("fet"); row.append(b);
  } else if (q.type === "choice") {
    q.choices.forEach((c, i) => { const b = document.createElement("button"); b.textContent = c; b.onclick = () => send(i); row.append(b); });
  } else {
    const input = document.createElement("input");
    input.inputMode = "decimal"; input.setAttribute("aria-label", "La teva resposta"); input.style.cssText = "font:inherit;width:120px;padding:6px 10px";
    const b = document.createElement("button"); b.textContent = "Comprova";
    b.onclick = () => send(input.value);
    input.onkeydown = e => { if (e.key === "Enter") send(input.value); };
    row.append(input, b);
  }
  $("#feed").prepend(div);
}

$("#solution").onclick = async () => {
  const r = await api("solution");
  draw(r.frames);
  say(`<strong>La resposta correcta és la ${esc(r.label)}.</strong>`
    + (r.text ? `<br>${esc(r.text)}${badge(r.status)}` : `<small>Encara no tenim una solució explicada per a aquest problema.</small>`), "ok");
};

$("#next").onclick = async () => {
  const r = await api("next");
  if (r.error) return say(esc(r.error));
  show(r);
};

api("state").then(show);
</script>
</body>
</html>
