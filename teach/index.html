<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cangur tutor</title>
<style>
  /* Design inspired by Duolingo: rounded shapes, bold colours, chunky 3D buttons */
  :root { --ink: #4b4b4b; --muted: #777777; --line: #e5e5e5; --bg: #ffffff; --card: #ffffff; --accent: #1cb0f6; --accent-dark: #1899d6;
          --green: #58cc02; --green-dark: #58a700;
          --ok: #58a700; --ok-bg: #d7ffb8; --bad: #ea2b2b; --bad-bg: #ffdfe0; --warn: #b87300; --warn-bg: #fff3cc;
          --soft: #f7f7f7; --led-off: #2b3a44; --led-on: #1cb0f6; --board: #131f24; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f1f7fb; --muted: #afafaf; --line: #37464f; --bg: #131f24; --card: #131f24; --soft: #202f36;
          --accent: #49c0f8; --accent-dark: #1899d6; --ok: #89e219; --ok-bg: #202f36; --bad: #ff7878; --bad-bg: #202f36; --warn: #ffc800; --warn-bg: #3a3210; --board: #0b1418; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 17px/1.5 "Nunito", "DIN Round Pro", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 2px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 26px; font-weight: 800; margin: 0 14px 0 0; color: var(--green); letter-spacing: -.3px; }
  header h1::before { content: "🦘 "; }
  .pill { font-size: 13px; font-weight: 800; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); background: var(--card); text-transform: uppercase; letter-spacing: .5px; }
  #grade { color: var(--accent); border-color: var(--accent); }
  #topic { color: var(--green-dark); border-color: var(--green); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 24px; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section, aside > div { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px 22px; }
  aside { display: flex; flex-direction: column; gap: 20px; }
  aside strong { font-weight: 800; font-size: 18px; color: var(--ink); }
  .problem-img { width: 100%; height: auto; background: #fff; border: 2px solid var(--line); border-radius: 16px; }
  .letters { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 10px; }
  .letters button { width: 72px; height: 62px; font: inherit; font-size: 26px; font-weight: 800; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; background: var(--card); color: var(--ink); cursor: pointer; transition: transform .05s; }
  .letters button:hover:not(:disabled) { background: var(--soft); border-color: var(--accent); color: var(--accent); }
  .letters button:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
  .letters button:focus-visible, .actions button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .letters button.right { background: var(--ok-bg); border-color: var(--green); color: var(--ok); }
  .letters button.wrong { background: var(--bad-bg); border-color: #ff4b4b; color: var(--bad); }
  .letters button:disabled { cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: center; }
  .actions button { font: inherit; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; padding: 12px 20px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--card); color: var(--accent); cursor: pointer; transition: transform .05s; }
  .actions button:hover:not(:disabled) { background: var(--soft); }
  .actions button:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
  .actions button:disabled { opacity: .5; cursor: default; }
  .actions button.primary { background: var(--green); border-color: var(--green-dark); color: #fff; }
  .actions button.primary:hover:not(:disabled) { background: #61d800; }
  #chat button[type="submit"] { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  #chat button[type="submit"]:hover { background: #3cc0ff; }
  #chattext { border: 2px solid var(--line) !important; border-radius: 16px !important; padding: 12px 16px !important; background: var(--soft) !important; font-weight: 600; }
  #chattext:focus { outline: none; border-color: var(--accent) !important; background: var(--card) !important; }
  #feed { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .msg { border: 2px solid var(--line); border-left-width: 2px; padding: 12px 16px; background: var(--soft); border-radius: 16px; }
  .msg.ok { border-color: var(--green); background: var(--ok-bg); }
  .msg.bad { border-color: #ff4b4b; background: var(--bad-bg); }
  .msg.help { border-color: var(--accent); background: var(--card); }
  .msg strong { font-weight: 800; }
  .msg small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
  .msg input { border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  .badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 2px 10px; border-radius: 999px; margin-left: 6px; background: var(--warn-bg); color: var(--warn); }
  .badge.revisado { background: var(--ok-bg); color: var(--ok); }
  .msg img { max-width: 100%; margin-top: 8px; background: #fff; border-radius: 12px; }
  .matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; padding: 14px; background: var(--board); border-radius: 16px; }
  .matrix span { aspect-ratio: 1; border-radius: 50%; background: var(--led-off); }
  .matrix span.on { background: var(--led-on); box-shadow: 0 0 8px var(--led-on); }
  .muted { color: var(--muted); font-size: 14px; }
  label.muted { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  input[type="checkbox"] { accent-color: var(--green); width: 18px; height: 18px; }
  details.debug { margin-top: 6px; font-size: 13px; color: var(--muted); }
  details.debug summary { cursor: pointer; font-weight: 800; color: var(--accent); }
  details.debug pre { white-space: pre-wrap; margin: 4px 0 0; font: 12px/1.4 ui-monospace, monospace; }
  body.nodebug details.debug { display: none; }
  ol { padding-left: 22px; margin: 6px 0 0; }
  /* "One like this, but yours": a practice problem made on the spot, as text */
  .msg.practice { border-color: var(--green); background: var(--card); }
  .msg.practice .ptext { font-size: 19px; margin: 8px 0 0; }
  .msg.practice .letters { margin: 14px 0 6px; }
  .msg.practice .letters button { width: auto; min-width: 72px; height: 54px; padding: 0 16px; font-size: 19px; }
  .msg.practice .letters button b { color: var(--muted); font-weight: 800; margin-right: 8px; }
  .msg.practice .preply { margin-top: 8px; }
  .msg.practice .preply p { margin: 6px 0 0; }
  .msg .inline { font: inherit; font-weight: 800; font-size: 14px; margin-top: 10px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--green); border-bottom-width: 4px; background: var(--card); color: var(--ok); cursor: pointer; }
  .msg .inline:hover { background: var(--soft); }
  .msg .inline:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  /* Exam mode: a timed paper in the tutor's place, no hints, the competition's scoring */
  #exambtn { margin-left: auto; font: inherit; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; padding: 8px 16px; border-radius: 14px; border: 2px solid var(--accent-dark); border-bottom-width: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  #exambtn:hover { background: #3cc0ff; }
  #exambtn:focus-visible, .chips button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #exampane h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
  #exampane h3 { margin: 18px 0 6px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  #exampane .rules { margin: 8px 0 0; padding-left: 22px; }
  .actions button.picked { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  .ebar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .timer { font: 800 34px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; padding: 8px 16px; border-radius: 16px; border: 2px solid var(--line); }
  .timer.late { color: var(--bad); border-color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chips button { font: inherit; font-weight: 800; font-size: 14px; min-width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
  .chips button.answered { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  .chips button.here { border-color: var(--ink); color: var(--ink); }
  .chips button.answered.here { color: #fff; box-shadow: 0 0 0 2px var(--ink); }
  #exampane .letters button.picked { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  .confirm { margin-top: 12px; padding: 12px 16px; border: 2px solid var(--warn); background: var(--warn-bg); border-radius: 16px; }
  .score { font-size: 30px; font-weight: 800; margin: 4px 0; color: var(--green-dark); }
  .review { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .review li { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px; }
  .review li.right { border-color: var(--green); }
  .review li.wrong { border-color: #ff4b4b; }
  .review li b { min-width: 28px; }
  .review li .what { flex: 1; min-width: 180px; }
  .review li .delta { font-variant-numeric: tabular-nums; font-weight: 800; }
  .review li button { font: inherit; font-weight: 800; font-size: 14px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--green); border-bottom-width: 4px; background: var(--card); color: var(--ok); cursor: pointer; }
  .review li button:hover { background: var(--soft); }
</style>
</head>
<body>
<header>
  <h1>Tutor Cangur</h1>
  <span class="pill" id="grade"></span>
  <span class="pill" id="topic"></span>
  <span class="pill" id="pid"></span>
  <button id="exambtn">Mode examen</button>
</header>
<main>
  <section id="exampane" hidden></section>
  <section id="tutorpane">
    <img class="problem-img" id="img" alt="Enunciat del problema">
    <div class="letters" id="letters" role="group" aria-label="Respostes"></div>
    <div class="actions">
      <button id="help" class="primary">Una pista</button>
      <button id="solution">Veure la solució</button>
      <button id="practice" hidden>Un de semblant</button>
      <button id="next">Següent problema</button>
    </div>
    <form id="chat" class="actions" autocomplete="off">
      <input id="chattext" maxlength="200" placeholder="Escriu al tutor: «no ho entenc», «crec que és la B»…" aria-label="Escriu al tutor"
        style="flex:1;min-width:220px;font:inherit;color:var(--ink)">
      <button type="submit">Envia</button>
    </form>
    <div id="feed" aria-live="polite"></div>
  </section>
  <aside>
    <div>
      <strong>Matriu LED de la placa</strong>
      <p class="muted">Simulada a la pantalla: el mateix que es veurà a la UNO Q.</p>
      <div class="matrix" id="matrix" aria-hidden="true"></div>
    </div>
    <label class="muted"><input type="checkbox" id="debugtoggle" checked> Mostra els detalls de prova (guardes i model)</label>
    <div class="muted">
      Les respostes es corregeixen amb la solució verificada del Cangur, no amb el model.
      Cada ajuda indica d'on surt i si una persona l'ha revisada.
    </div>
  </aside>
</main>
<script>
const TOPICS = { aritmetica: "Càlcul amb dades", algebra: "Número amagat (tempteig)", conteo: "Comptar", numeros: "Propietats dels números",
  logica: "Lògica", patrones: "Patrons", geometria_plana: "Geometria plana", geometria_espacial: "Geometria de l'espai",
  medida: "Mesura", visual: "Raonament visual", otros: "Altres" };
const STATUS = { revisado: "revisat", preparado: "preparat", generado: "esborrany, no revisat", dataset: "problema del Cangur" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const matrix = $("#matrix");
for (let i = 0; i < 8 * 13; i++) matrix.append(document.createElement("span"));
function draw(frames) {
  if (!frames || !frames.length) return;
  const grid = frames[frames.length - 1];
  grid.flat().forEach((v, i) => matrix.children[i].classList.toggle("on", v > 0));
}

// GET routes with the arguments in the path: the same API on the laptop server and in the App Lab app
async function api(action, body) {
  body = body || {};
  const enc = encodeURIComponent;
  const path = action === "answer" ? `answer/${enc(body.letter)}`
    : action === "respond" ? `respond/${enc(body.qid)}/${enc(String(body.value))}`
    : action === "start" ? `start/${enc(body.key)}`
    : action === "chat" ? `chat/${enc(body.text)}`
    : action === "job" ? `job/${enc(body.id)}`
    : action === "practiceanswer" ? `practiceanswer/${enc(body.letter)}`
    : action === "examstart" ? `examstart/${enc(body.level)}/${enc(body.paper)}`
    : action === "examanswer" ? `examanswer/${enc(body.n)}/${enc(body.letter)}` : action;
  const r = await fetch("api/" + path);
  return r.json();
}
function say(html, kind) {
  const div = document.createElement("div");
  div.className = "msg " + (kind || "");
  div.innerHTML = html;
  $("#feed").prepend(div);
}
function badge(status) {
  if (status === "generado:qwen") return `<span class="badge">generat pel model (Qwen), validat per les guardes</span>`;
  if (status === "plantilla") return `<span class="badge">plantilla fixa</span>`;
  if (status === "regla") return `<span class="badge">deduït per regles, sense model</span>`;
  const base = String(status || "").split(":")[0];
  return base ? `<span class="badge ${esc(base)}">${esc(STATUS[base] || base)}</span>` : "";
}

function show(view) {
  const p = view.problem;
  $("#img").src = "img/" + encodeURIComponent(p.key) + ".png";
  $("#grade").textContent = `${p.grade}è de primària · dificultat ${p.difficulty}`;
  $("#topic").textContent = TOPICS[p.topic] || p.topic;
  $("#pid").textContent = p.id;
  $("#feed").innerHTML = "";
  const box = $("#letters");
  box.innerHTML = "";
  for (const letter of "ABCDE") {
    const b = document.createElement("button");
    b.textContent = letter;
    b.setAttribute("aria-label", `Resposta ${letter}: ${p.options[letter] ?? ""}`);
    b.onclick = () => answer(letter, b);
    box.append(b);
  }
  draw(view.frames);
  // Offer a practice problem only where the server can make one for this kind of problem
  canPractise = false;
  $("#practice").hidden = true;
  api("practiceok").then(r => { canPractise = !!(r && r.available); $("#practice").hidden = !canPractise; }).catch(() => {});
}

// --- "One like this, but yours": a fresh problem of the same kind, with the slip named ---
let canPractise = false, practising = false;
async function practise() {
  if (practising) return;  // a double click must not make two cards: the server keeps one practice problem
  practising = true;
  let r;
  try { r = await api("practice"); } finally { practising = false; }
  if (r.error) return say("Ara mateix no puc fer un problema semblant a aquest.", "help");
  draw(r.frames);
  document.querySelectorAll(".msg.practice").forEach(d => d.remove());
  const div = document.createElement("div");
  div.className = "msg practice";
  div.innerHTML = `<strong>Un de semblant, però teu.</strong><span class="badge revisado">problema nou, resposta calculada</span>
    <small>Acabat de fer per a tu, del mateix tipus. Resol-lo i després torna al teu problema.</small>
    <p class="ptext">${esc(r.text)}</p>
    <div class="letters" role="group" aria-label="Respostes del problema semblant"></div>
    <div class="preply" aria-live="polite"></div>
    <div class="actions">
      <button class="pmore">Un altre</button>
      <button class="psol" disabled>Com es resol</button>
      <button class="pback">Torna al meu problema</button>
    </div>`;
  const box = div.querySelector(".letters"), reply = div.querySelector(".preply");
  const lock = () => box.querySelectorAll("button").forEach(b => b.disabled = true);
  for (const letter of "ABCDE") {
    const b = document.createElement("button");
    b.innerHTML = `<b>${letter}</b>${esc(r.options[letter])}`;
    b.setAttribute("aria-label", `Resposta ${letter}: ${r.options[letter]}`);
    b.onclick = async () => {
      const a = await api("practiceanswer", { letter });
      if (a.error) { reply.textContent = a.error; return; }
      draw(a.frames);
      b.classList.add(a.correct ? "right" : "wrong");
      b.disabled = true;
      div.querySelector(".psol").disabled = false;
      if (a.correct) {
        lock();
        div.querySelector(".psol").hidden = true;
        reply.innerHTML = `<strong>Molt bé! La ${letter} és correcta.</strong><p>${esc(a.solution)}</p>
          <p>Ara torna al teu problema: què tenen en comú tots dos?</p>`;
      } else {
        reply.innerHTML = `<strong>La ${letter} no és correcta.</strong> ${esc(a.mistake.text)}${badge(a.mistake.status)}`;
      }
    };
    box.append(b);
  }
  div.querySelector(".pmore").onclick = practise;
  div.querySelector(".psol").onclick = async () => {
    const a = await api("practicesolution");
    if (a.error) { reply.textContent = a.error; return; }
    draw(a.frames);
    lock();
    box.children["ABCDE".indexOf(a.label)].classList.add("right");
    reply.innerHTML = `<strong>La resposta és la ${esc(a.label)}: ${esc(a.answer)}.</strong><p>${esc(a.text)}</p>
      <p>Ara torna al teu problema: què tenen en comú tots dos?</p>`;
  };
  div.querySelector(".pback").onclick = () => { div.remove(); $("#img").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#feed").prepend(div);
  div.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
$("#practice").onclick = practise;

async function answer(letter, button) {
  const r = await api("answer", { letter });
  if (r.error) return say(esc(r.error), "bad");
  button.classList.add(r.correct ? "right" : "wrong");
  if (r.correct) {
    say(`<strong>Molt bé! La ${letter} és correcta.</strong>`, "ok");
    $("#letters").querySelectorAll("button").forEach(b => b.disabled = true);  // not the practice card's options
  } else {
    button.disabled = true;
    say(`<strong>La ${letter} no és correcta.</strong> Torna-ho a provar o demana una pista.`
      + (r.feedback ? `<br>${esc(r.feedback.text)}${badge(r.feedback.status)}` : "")
      + (canPractise ? `<br><button class="inline">Prova'n un de semblant, però teu</button>` : ""), "bad");
    const offer = $("#feed").firstElementChild.querySelector(".inline");
    if (offer) offer.onclick = practise;
  }
  draw(r.frames);
}

$("#help").onclick = async () => {
  const r = await api("help");
  draw(r.frames);
  showStep(r);
};

function showStep(r) {
  if (r.kind === "similar") {
    const p = r.problem;
    say(`<strong>Pista 1: un problema semblant, més fàcil.</strong>${badge("dataset")}
      <small>Del mateix tipus, ${p.grade}è de primària. Mira com es resol i pensa què té en comú amb el teu.</small>
      <img src="img/${encodeURIComponent(p.key)}.png" alt="Problema semblant ${esc(p.id)}">
      <small>La resposta d'aquest problema és la ${esc(r.label)}.</small>`, "help");
  } else if (r.kind === "method") {
    say(`<strong>Pista 2: com s'enfoca aquest tipus de problema.</strong>${badge(r.status)}
      <br>${esc(r.text)}<ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>`, "help");
  } else if (r.kind === "question") {
    ask(r);
  } else if (r.kind === "hint") {
    say(`<strong>Pista: </strong>${esc(r.text)}${badge(r.status)}`, "help");
  } else {
    say("Ja no hi ha més pistes per a aquest problema. Si vols, pots veure la solució.", "help");
  }
}

// --- Free text and the model: input guardrails, the model in the background, output guardrails ---
const INTENT = { pista: "demana una pista", repetir: "vol que es repeteixi", siguiente: "vol el següent problema",
  solucion: "vol la solució", progreso: "pregunta pel progrés", ayuda_app: "pregunta com funciona", eleccion: "respon amb una lletra",
  math: "pregunta sobre el problema", social: "salutació", offtopic: "fora de tema", injection: "intent de manipulació" };
function debugBlock(d) {
  if (!d) return "";
  const lines = [`Entrada: ${d.input ?? "(botó)"}`, `Guarda d'entrada: ${INTENT[d.intent] || d.intent || "—"}`];
  if (d.matched) lines.push(`Ajuda escrita triada: ${d.matched}${d.kind_of_question ? " (pregunta de tipus «" + d.kind_of_question + "»)" : ""}`);
  if ("accepted" in d) {
    lines.push(`Model (${d.seconds} s, ${d.prompt_tokens ?? "?"} tokens llegits, ${d.generated_tokens ?? "?"} escrits): ${d.model_error || JSON.stringify(d.model_text)}`);
    lines.push(`Guarda de sortida: ${d.accepted ? "acceptat" : "rebutjat (" + d.rail + "), es mostra el pas següent de la guia"}`);
  }
  return `<details class="debug"><summary>Detalls de prova</summary><pre>${esc(lines.join("\n"))}</pre></details>`;
}
async function waitJob(job, debugBefore) {
  const div = document.createElement("div");
  div.className = "msg help";
  div.innerHTML = `<strong>El tutor està pensant…</strong><small>El model de la placa triga uns segons.</small>`;
  $("#feed").prepend(div);
  const started = Date.now();
  while (true) {
    await new Promise(res => setTimeout(res, 1000));
    const r = await api("job", { id: job });
    if (!r.done) { div.querySelector("small").textContent = `El model de la placa triga uns segons… (${Math.round((Date.now() - started) / 1000)} s)`; continue; }
    draw(r.frames);
    if (r.kind === "help" && r.step) {  // the model's answer was rejected: the next step of the guide
      div.remove();
      showStep(r.step);
      const dbg = debugBlock(r.debug);
      if (dbg) $("#feed").firstElementChild.insertAdjacentHTML("beforeend", dbg);
      return;
    }
    div.innerHTML = `<strong>Tutor: </strong>${esc(r.text || r.error || "")}${badge(r.status)}${debugBlock(r.debug)}`;
    return;
  }
}
$("#chat").onsubmit = async e => {
  e.preventDefault();
  const text = $("#chattext").value.trim();
  if (!text) return;
  $("#chattext").value = "";
  say(`<strong>Tu:</strong> ${esc(text)}`);
  const r = await api("chat", { text });
  draw(r.frames);
  const dbg = debugBlock(r.debug);
  if (r.error) return say(esc(r.error), "bad");
  if (r.kind === "rail") {
    say(`${esc(r.text)}${dbg}`, "help");
    if (r.locked) { $("#chattext").disabled = true; $("#chattext").placeholder = "Fem servir els botons."; }
  } else if (r.kind === "answer") {
    say((r.correct ? "<strong>Molt bé, és correcta!</strong>" : "<strong>Aquesta no és correcta.</strong>")
      + (r.feedback ? `<br>${esc(r.feedback.text)}${badge(r.feedback.status)}` : "") + dbg, r.correct ? "ok" : "bad");
  } else if (r.kind === "reply") {  // written help picked for this question, outside the guide
    say(`${esc(r.text)}${badge(r.status)}${dbg}`, r.tone === "ok" ? "ok" : "help");
  } else if (r.kind === "help") {
    if (r.before) say(esc(r.before), "help");
    showStep(r.step);
    if (dbg) $("#feed").firstElementChild.insertAdjacentHTML("beforeend", dbg);
  } else if (r.kind === "solution") {
    say(`<strong>La resposta correcta és la ${esc(r.label)}.</strong>` + (r.text ? `<br>${esc(r.text)}${badge(r.status)}` : "") + dbg, "ok");
  } else if (r.kind === "next" && r.view) {
    show(r.view);
  } else if (r.kind === "job") {
    waitJob(r.job);
  }
};
$("#debugtoggle").onchange = e => document.body.classList.toggle("nodebug", !e.target.checked);

const QTITLE = { compare: "Compara", guide: "Pensa", checkpoint: "Comprova un pas" };
function ask(q) {
  const div = document.createElement("div");
  div.className = "msg help";
  const title = QTITLE[q.qid.split(" ")[0]] || "Pregunta";
  div.innerHTML = `<strong>${esc(title)}:</strong> ${esc(q.text)}${badge(q.status)}<div class="actions"></div><small class="reply"></small>`;
  const row = div.querySelector(".actions"), reply = div.querySelector(".reply");
  const send = async value => {
    const r = await api("respond", { qid: q.qid, value });
    if (r.error) { reply.textContent = r.error === "write a number" ? "Escriu un número." : r.error; return; }
    draw(r.frames);
    if (r.correct === null) { reply.textContent = "Molt bé. Quan ho tinguis, demana el pas següent."; row.remove(); return; }
    reply.textContent = (r.correct ? "Correcte! " : "Encara no. ") + (r.feedback || "");
    reply.style.color = r.correct ? "var(--ok)" : "var(--bad)";
    if (r.correct) row.querySelectorAll("button, input").forEach(e => e.disabled = true);
  };
  if (q.type === "reflect") {
    const b = document.createElement("button"); b.textContent = "Fet"; b.onclick = () => send("fet"); row.append(b);
  } else if (q.type === "choice") {
    q.choices.forEach((c, i) => { const b = document.createElement("button"); b.textContent = c; b.onclick = () => send(i); row.append(b); });
  } else {
    const input = document.createElement("input");
    input.inputMode = "decimal"; input.setAttribute("aria-label", "La teva resposta"); input.style.cssText = "font:inherit;width:120px;padding:6px 10px";
    const b = document.createElement("button"); b.textContent = "Comprova";
    b.onclick = () => send(input.value);
    input.onkeydown = e => { if (e.key === "Enter") send(input.value); };
    row.append(input, b);
  }
  $("#feed").prepend(div);
}

$("#solution").onclick = async () => {
  const r = await api("solution");
  draw(r.frames);
  say(`<strong>La resposta correcta és la ${esc(r.label)}.</strong>`
    + (r.text ? `<br>${esc(r.text)}${badge(r.status)}` : `<small>Encara no tenim una solució explicada per a aquest problema.</small>`), "ok");
};

$("#next").onclick = async () => {
  const r = await api("next");
  if (r.error) return say(esc(r.error));
  show(r);
};

// --- Exam mode: a timed paper, no feedback until it is handed in, then a review that leads to the tutor ---
const PAPER = { tast: "Tast", curt: "Curt", complet: "Complet" };
const pane = $("#exampane");
const num = v => String(v).replace(".", ",").replace("-", "−");   // 3.75 -> 3,75
const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
let exam = { status: "none" }, examClock = null, examBusy = false;

function examButton() {  // the header button: into the exam, back to its result, or nothing while a paper runs
  const inExam = !pane.hidden;
  $("#exambtn").hidden = inExam;
  $("#exambtn").textContent = exam.status === "finished" ? "Resultats de l'examen" : "Mode examen";
}
function showPane(examSide) {
  pane.hidden = !examSide;
  $("#tutorpane").hidden = examSide;
  for (const id of ["#grade", "#topic", "#pid"]) $(id).hidden = examSide;  // they describe the tutor's problem
  examButton();
  if (examSide) pane.scrollIntoView({ block: "start" });
}
function stopClock() { if (examClock !== null) { clearInterval(examClock); examClock = null; } }
async function examCall(action, body) {  // one request at a time: a fast double click cannot hand in twice
  if (examBusy) return null;
  examBusy = true;
  try { return await api(action, body); } catch (e) { return { error: "No s'ha pogut parlar amb el tutor. Torna-ho a provar." }; }
  finally { examBusy = false; }
}

async function examSetup() {
  stopClock();
  const info = await api("examinfo");
  const r = info.rules, f = r.wrong_fraction;
  const share = f[0] === 1 && f[1] === 4 ? "una quarta part" : f[0] === 1 && f[1] === 2 ? "la meitat" : `${f[0]}/${f[1]}`;
  const pts = r.points.slice(0, -1).join(", ") + " o " + r.points[r.points.length - 1];
  pane.innerHTML = `<h2>Mode examen</h2>
    <p>Un examen com el del Cangur: temps limitat, sense pistes, i no sabràs si l'has encertat fins que el lliuris.</p>
    <ul class="rules">
      <li>Les preguntes valen ${esc(pts)} punts: com més avall, més difícils.</li>
      <li>Cada resposta equivocada resta ${esc(share)} dels punts de la pregunta.</li>
      <li>${r.blank === 0 ? "Una pregunta en blanc ni suma ni resta." : `Una pregunta en blanc val ${num(r.blank)} punts.`}</li>
      ${r.start_per_question ? `<li>Comences amb ${plural(r.start_per_question, "punt", "punts")} per pregunta.</li>` : ""}
    </ul>
    <h3>Curs</h3><div class="actions levelpick"></div>
    <h3>Examen</h3><div class="actions paperpick"></div>
    <div class="actions" style="margin-top:22px">
      <button class="primary estart">Comença l'examen</button>
      <button class="eleave">Torna al tutor</button>
    </div><p class="muted emsg" aria-live="polite"></p>`;
  if (!info.levels.length) {
    pane.querySelector(".emsg").textContent = "No hi ha prou problemes per fer un examen.";
    pane.querySelector(".estart").disabled = true;
  }
  let level = info.levels.length ? info.levels[0] : null, paper = null;
  const papers = () => {
    const row = pane.querySelector(".paperpick");
    row.innerHTML = "";
    if (!level) return;
    if (!level.papers.includes(paper)) paper = level.papers[0];
    for (const name of level.papers) {
      const b = document.createElement("button"), p = info.papers[name];
      b.textContent = `${PAPER[name] || name} · ${plural(p.questions, "pregunta", "preguntes")} · ${plural(p.minutes, "minut", "minuts")}`;
      b.classList.toggle("picked", name === paper);
      b.setAttribute("aria-pressed", String(name === paper));
      b.onclick = () => { paper = name; papers(); };
      row.append(b);
    }
  };
  const levels = () => {
    const row = pane.querySelector(".levelpick");
    row.innerHTML = "";
    for (const l of info.levels) {
      const b = document.createElement("button");
      b.textContent = l.grade ? `${l.grade}è de primària` : `Nivell ${l.level}`;
      b.classList.toggle("picked", l === level);
      b.setAttribute("aria-pressed", String(l === level));
      b.onclick = () => { level = l; levels(); papers(); };
      row.append(b);
    }
  };
  levels(); papers();
  pane.querySelector(".eleave").onclick = () => showPane(false);
  pane.querySelector(".estart").onclick = async () => {
    const r = await examCall("examstart", { level: level.level, paper });
    if (!r) return;
    if (r.error) { pane.querySelector(".emsg").textContent = "No s'ha pogut començar l'examen."; return; }
    examRun(r);
  };
}

function examRun(state) {
  exam = state;
  draw(state.frames);
  const qs = state.questions, answers = { ...state.answers };
  let at = 0, left = state.left, sync = 0;
  pane.innerHTML = `<div class="ebar">
      <div><h2 class="etitle"></h2><span class="muted evalue"></span></div>
      <div class="timer" role="timer" aria-label="Temps que queda"></div>
    </div>
    <div class="chips" role="group" aria-label="Preguntes de l'examen"></div>
    <img class="problem-img eimg" alt="Enunciat de la pregunta">
    <div class="letters" role="group" aria-label="Respostes"></div>
    <div class="actions">
      <button class="eprev">Anterior</button>
      <button class="eblank">Deixa-la en blanc</button>
      <button class="enext">Següent</button>
    </div>
    <div class="actions" style="margin-top:22px">
      <button class="primary ehand">Lliura l'examen</button>
      <button class="equit">Surt sense lliurar</button>
    </div>
    <div class="confirm" hidden aria-live="polite"></div>
    <p class="muted emsg" aria-live="polite"></p>`;
  const chips = pane.querySelector(".chips"), box = pane.querySelector(".letters"), confirmBox = pane.querySelector(".confirm");
  const clock = () => {
    const t = pane.querySelector(".timer");
    t.textContent = mmss(left);
    t.classList.toggle("late", left < 60);
  };
  const over = r => { stopClock(); examDone(r); };
  const paint = () => {
    const q = qs[at];
    pane.querySelector(".etitle").textContent = `Pregunta ${q.n} de ${qs.length}`;
    pane.querySelector(".evalue").textContent = `Val ${plural(q.points, "punt", "punts")}`;
    pane.querySelector(".eimg").src = "img/" + encodeURIComponent(q.key) + ".png";
    chips.querySelectorAll("button").forEach((c, i) => {
      c.classList.toggle("answered", !!answers[qs[i].n]);
      c.classList.toggle("here", i === at);
      c.setAttribute("aria-label", `Pregunta ${qs[i].n}, ${answers[qs[i].n] ? "resposta " + answers[qs[i].n] : "en blanc"}`);
    });
    box.querySelectorAll("button").forEach(b => {
      const on = answers[q.n] === b.textContent;
      b.classList.toggle("picked", on);
      b.setAttribute("aria-pressed", String(on));
      b.setAttribute("aria-label", `Resposta ${b.textContent}: ${(q.options || {})[b.textContent] ?? ""}`);
    });
    pane.querySelector(".eprev").disabled = at === 0;
    pane.querySelector(".enext").disabled = at === qs.length - 1;
    pane.querySelector(".eblank").disabled = !answers[q.n];
    confirmBox.hidden = true;
  };
  const mark = async letter => {
    const n = qs[at].n;
    const r = await examCall("examanswer", { n, letter });
    if (!r) return;
    if (r.error) { pane.querySelector(".emsg").textContent = "No s'ha pogut desar la resposta. Torna-ho a provar."; return; }
    if (r.status === "finished") return over(r);
    pane.querySelector(".emsg").textContent = "";
    if (r.letter) answers[n] = r.letter; else delete answers[n];
    left = r.left;
    clock(); draw(r.frames); paint();
  };
  qs.forEach((q, i) => {
    const c = document.createElement("button");
    c.textContent = q.n;
    c.onclick = () => { at = i; paint(); };
    chips.append(c);
  });
  for (const letter of "ABCDE") {
    const b = document.createElement("button");
    b.textContent = letter;
    b.onclick = () => mark(letter);
    box.append(b);
  }
  pane.querySelector(".eprev").onclick = () => { at--; paint(); };
  pane.querySelector(".enext").onclick = () => { at++; paint(); };
  pane.querySelector(".eblank").onclick = () => mark("-");
  const confirmWith = (text, yes, action) => {
    confirmBox.innerHTML = `${esc(text)}<div class="actions"><button class="primary yes">${esc(yes)}</button><button class="no">Encara no</button></div>`;
    confirmBox.hidden = false;
    confirmBox.querySelector(".no").onclick = () => { confirmBox.hidden = true; };
    confirmBox.querySelector(".yes").onclick = action;
    confirmBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  pane.querySelector(".ehand").onclick = () => confirmWith(
    `Has respost ${Object.keys(answers).length} de ${plural(qs.length, "pregunta", "preguntes")}. Vols lliurar l'examen?`, "Sí, lliura'l",
    async () => { const r = await examCall("examfinish"); if (r && !r.error) over(r); });
  pane.querySelector(".equit").onclick = () => confirmWith(
    "Si surts ara, l'examen es perd i no es corregeix. Vols sortir?", "Sí, surt",
    async () => { const r = await examCall("examclose"); if (!r || r.error) return; stopClock(); exam = { status: "none" }; draw(r.frames); showPane(false); });
  // The page counts the seconds; the server owns the time. Asking it also moves the countdown on the board
  stopClock();
  examClock = setInterval(async () => {
    if (left > 0) left--;
    clock();
    if (++sync < (left <= 60 ? 1 : 5) && left > 0) return;
    sync = 0;
    if (examBusy) return;
    let r;
    try { r = await api("examtick"); } catch (e) { return; }
    if (examClock === null || r.error) return;
    if (r.status === "finished") return over(r);
    left = r.left;
    clock(); draw(r.frames);
  }, 1000);
  clock(); paint();
  showPane(true);
}

const OUTCOME = { right: "Encertada", wrong: "Equivocada", blank: "En blanc" };
function examDone(r) {
  exam = r;
  draw(r.frames);
  const g = r.guess;
  const tip = g.pays_from === null ? "Amb aquestes regles, respondre a l'atzar fa perdre punts de mitjana: si dubtes, deixa-la en blanc."
    : g.pays_from === 0 ? "Amb aquestes regles, respondre sempre surt a compte, encara que dubtis."
    : `Si no pots descartar ${g.pays_from === 1 ? "cap opció" : "almenys " + g.pays_from + " opcions"}, respondre a l'atzar ${g.sign_with_none_out === 0 && g.pays_from === 1 ? "no et fa guanyar ni perdre punts de mitjana" : "no surt a compte"}. `
      + `Si en pots descartar ${g.pays_from === 1 ? "una o més" : g.pays_from + " o més"}, de mitjana hi surts guanyant.`;
  pane.innerHTML = `<h2>${r.timed_out ? "S'ha acabat el temps" : "Examen lliurat"}</h2>
    <p class="score">${num(r.score)} punts de ${num(r.maximum)}</p>
    <p>Encertades: ${r.right} · Equivocades: ${r.wrong} · En blanc: ${r.blank}</p>
    <p class="muted">${r.start ? `${plural(r.start, "punt", "punts")} de sortida, ` : ""}+${num(r.gained)} per les encertades, −${num(r.lost)} per les equivocades.</p>
    ${r.wrong ? `<p>Les respostes equivocades t'han restat ${plural(r.lost, "punt", "punts")}. Deixant-les en blanc tindries ${plural(r.if_blank, "punt", "punts")}.</p>` : ""}
    <p><strong>Quan val la pena arriscar?</strong> ${esc(tip)}</p>
    <h3>Repàs</h3>
    <p class="muted">Aquí no es diu quina era la resposta correcta: torna a provar cada pregunta amb el tutor, amb pistes si et calen.</p>
    <ul class="review"></ul>
    <div class="actions" style="margin-top:22px">
      <button class="primary eagain">Un altre examen</button>
      <button class="eleave">Torna al tutor</button>
    </div>`;
  const list = pane.querySelector(".review");
  for (const q of r.questions) {
    const li = document.createElement("li");
    li.className = q.outcome;
    li.setAttribute("data-img", "img/" + encodeURIComponent(q.key) + ".png");
    li.innerHTML = `<b>${q.n}</b><span class="what">${OUTCOME[q.outcome]}${q.given ? ` (has marcat la ${esc(q.given)})` : ""} · val ${plural(q.points, "punt", "punts")}</span>
      <span class="delta">${q.delta > 0 ? "+" : ""}${num(q.delta)}</span>
      <button>${q.outcome === "right" ? "Torna-la a veure" : "Repassa-la amb el tutor"}</button>`;
    li.querySelector("button").onclick = async () => {
      const view = await api("start", { key: q.key });
      if (view.error) return;
      show(view);
      showPane(false);
      say(`<strong>Pregunta ${q.n} de l'examen.</strong> ${q.outcome === "blank" ? "L'havies deixada en blanc." : q.outcome === "wrong" ? `Havies marcat la ${esc(q.given)}, que no és correcta.` : "L'havies encertada: sabries explicar per què?"}
        Ara tens pistes i tot el temps que vulguis. Per tornar al repàs, prem «Resultats de l'examen» a dalt.`, "help");
    };
    list.append(li);
  }
  pane.querySelector(".eagain").onclick = async () => { await api("examclose"); exam = { status: "none" }; examSetup(); };
  pane.querySelector(".eleave").onclick = () => showPane(false);
  showPane(true);
}

$("#exambtn").onclick = async () => {
  if (exam.status === "finished") return examDone(exam);
  await examSetup();
  showPane(true);
};

api("state").then(show).then(async () => {
  const r = await api("examstate");   // a reload in the middle of a paper goes back to it
  if (r.status === "running") examRun(r);
  else if (r.status === "finished") { exam = r; examButton(); }
}).catch(() => {});
</script>
